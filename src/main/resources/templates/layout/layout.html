<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:fragment="head">
  <meta charset="UTF-8">
  <title>WeStudy</title>

  <!-- Bootstrap (기존 페이지용) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="/css/common.css">

  <!-- Tailwind 커스텀 설정 -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            // New Design Palette
            "primary": "#e9b163",
            "primary-light": "#fdf3e3",
            "background-light": "#fbfaf8",
            "background-dark": "#211a11",
            "surface-light": "#ffffff",
            "surface-dark": "#2d2418",
            "text-main-light": "#1b150e",
            "text-main-dark": "#f3eee8",
            "text-sub-light": "#957850",
            "text-sub-dark": "#d1c4b0",
            "border-light": "#f3eee8",
            "border-dark": "#3e3223",

            // Legacy Mappings (기존 호환성 유지)
            "text-light-primary": "#1b150e",
            "text-light-secondary": "#957850",
            "text-dark-primary": "#f3eee8",
            "text-dark-secondary": "#d1c4b0",
            "card-light": "#ffffff",
            "card-dark": "#2d2418",

            // 기타 기존 색상 유지 또는 매핑
            "text-light": "#1b150e",
            "text-dark": "#f3eee8",
            "muted-text-light": "#957850",
            "muted-text-dark": "#d1c4b0",
            "muted-light": "#957850",
            "muted-dark": "#d1c4b0"
          },
          fontFamily: {
            "display": ["Lexend", "Noto Sans KR", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
    <style>
      /* 프리미엄 토스트 애니메이션 */
      @keyframes slide-in-right {
        0% { transform: translateX(100%); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      @keyframes slide-out-right {
        0% { transform: translateX(100%); opacity: 1; } /* 보정: 나갈 때는 오른쪽으로 */
        100% { transform: translateX(110%); opacity: 0; }
      }
      @keyframes toast-progress {
        0% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }
      
      .animate-slide-in { animation: slide-in-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-slide-out { animation: slide-out-right 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      
      /* 유리 질감 (Glassmorphism) */
      .glass {
        background: rgba(255, 255, 255, 0.8) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
      }
      .dark .glass {
        background: rgba(45, 36, 24, 0.8) !important;
      }
    </style>
  </head>

<body>

  <!-- 전체 레이아웃 fragment -->
  <div th:fragment="layout(content)">

    <!-- ✅ 화면 전체 높이 유지 + (헤더/메인/푸터) flex로 자연스럽게 배치 -->
    <div class="min-h-screen w-full flex flex-col overflow-x-hidden">

      <!-- Header -->
      <header
        class="sticky top-0 z-50 flex w-full justify-center border-b border-solid border-border-light dark:border-border-dark bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
        <div class="flex w-full max-w-[960px] items-center justify-between whitespace-nowrap px-4 py-3">

          <!-- 로고 -->
          <div class="flex items-center gap-4">
            <a href="/" class="flex items-center gap-3">
              <div class="size-6 text-text-light-primary dark:text-text-dark-primary">
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z"
                    fill="currentColor"></path>
                </svg>
              </div>
              <span
                class="text-lg font-bold leading-tight tracking-[-0.015em] text-text-light-primary dark:text-text-dark-primary">
                Westudy
              </span>
            </a>
          </div>

          <!-- 오른쪽 메뉴 -->
          <div class="flex flex-1 items-center justify-end gap-6">
            <nav class="hidden items-center gap-8 md:flex">
              <a class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary"
                href="/page/post/">스터디 모집</a>
              <a class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary"
                href="/page/study/">스터디 현황</a>

              <!-- 로그인 상태에 따라 분기 -->
              <th:block th:if="${nickname != null}">
                <a class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary"
                  href="/page/chat">실시간 채팅</a>
                <a href="/page/user/info/data"
                  class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary">
                  <span th:text="${nickname} + ' 님'">사용자 님</span>
                </a>
                <a href="/api/users/logout"
                  class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary">
                  로그아웃
                </a>
              </th:block>
              <th:block th:unless="${nickname != null}">
                <a class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary"
                  href="/page/user/login">로그인</a>
                <a class="text-sm font-medium leading-normal text-text-light-primary dark:text-text-dark-primary"
                  href="/page/user/signup">회원가입</a>
              </th:block>
            </nav>

            <!-- 알람 종 아이콘 (로그인 시에만) -->
            <th:block th:if="${nickname != null}">
              <div class="relative">
                <button id="alarm-btn" class="relative transition-transform active:scale-90 flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-border-light text-text-light-primary dark:bg-border-dark dark:text-text-dark-primary hover:bg-primary-light/50">
                  <span class="material-symbols-outlined !text-[24px]">notifications</span>
                  <!-- ✅ 아이콘 우측 상단 빨간 원 + 흰색 숫자 -->
                  <span id="alarm-count" class="hidden absolute -top-0.5 -right-0.5 flex min-w-[18px] h-[18px] items-center justify-center rounded-full bg-red-500 text-[10px] text-white font-bold px-1">0</span>
                </button>
                
                <!-- 알람 드롭다운 (디자인 보강) -->
                <div id="alarm-dropdown" class="hidden absolute right-0 mt-3 w-80 max-h-[450px] overflow-hidden rounded-2xl border border-border-light dark:border-border-dark bg-white dark:bg-surface-dark shadow-2xl z-[100] animate-in fade-in slide-in-from-top-2 duration-200">
                  <div class="px-5 py-4 border-b border-border-light dark:border-border-dark flex justify-between items-center bg-background-light dark:bg-background-dark/50">
                    <span class="font-bold text-sm tracking-tight">최근 알림</span>
                    <button onclick="readAllAlarms()" class="text-[11px] font-bold text-primary hover:text-primary/80 transition-colors uppercase tracking-wider">모두 읽음</button>
                  </div>
                  <div id="alarm-list" class="flex flex-col overflow-y-auto max-h-[380px] divide-y divide-border-light/50 dark:divide-border-dark/50">
                    <div class="p-8 text-center text-xs text-gray-400">새로운 알림이 없습니다.</div>
                  </div>
                </div>
              </div>
            </th:block>

            <!-- 다크모드 토글 -->
            <button
              class="flex h-10 w-10 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-border-light text-text-light-primary dark:bg-border-dark dark:text-text-dark-primary"
              id="theme-toggle-btn">
              <span class="material-symbols-outlined dark:hidden">dark_mode</span>
              <span class="material-symbols-outlined hidden dark:inline">light_mode</span>
            </button>
          </div>
        </div>
      </header>

      <!-- 실시간 알람 토스트 컨테이너 -->
      <div id="toast-container" class="fixed top-20 right-4 z-[200] flex flex-col gap-2 pointer-events-none"></div>

      <!-- ✅ Main: 남는 공간만 차지 + 상하/좌우 중앙 정렬 -->
      <!-- - flex-1 : 헤더/푸터 제외 남는 높이만 -->
      <!-- - justify-center : 상하 중앙 -->
      <!-- - items-center : 좌우 중앙 -->
      <main class="flex-1 w-full flex flex-col items-center justify-center" th:classappend="${mainClass}">
        <div class="w-full flex flex-col px-4 py-2"
          th:classappend="${contentMaxWidthClass != null ? contentMaxWidthClass : 'max-w-[960px]'}">
          <th:block th:replace="${content}"></th:block>
        </div>
      </main>

      <!-- Footer: 고정 아님(문서 흐름) -->
      <footer class="flex w-full justify-center border-t border-solid border-border-light dark:border-border-dark">
        <div
          class="flex w-full max-w-[960px] flex-col items-center gap-2 py-4 px-2 text-center md:flex-row md:justify-between">
          <div class="text-sm text-text-light-secondary dark:text-text-dark-secondary">
            © 2025 WeStudy. All rights reserved.
          </div>
          <div class="flex gap-2 text-sm">
            <a class="text-text-light-secondary dark:text-text-dark-secondary" href="/about">소개</a>
            <a class="text-text-light-secondary dark:text-text-dark-secondary" href="/privacy">개인정보처리방침</a>
            <a class="text-text-light-secondary dark:text-text-dark-secondary"
              href="mailto:bwhdgus0429@gmail.com">문의하기</a>
          </div>
        </div>
      </footer>

    </div>

    <!-- 다크모드 및 알람 스크립트 -->
    <script th:inline="javascript">
      // 1. 다크모드 토글
      const themeBtn = document.getElementById('theme-toggle-btn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
        });
      }

      // 2. 실시간 알림 (SSE) 시스템
      const nickname = [[${nickname}]];
      if (nickname) {
        initAlarmSystem();
      }

      function initAlarmSystem() {
        // SSE 연결
        const eventSource = new EventSource('/api/alarms/subscribe');

        eventSource.addEventListener('connect', (e) => {
          console.log('SSE Connected:', e.data);
        });

        eventSource.addEventListener('alarm', (e) => {
          const alarm = JSON.parse(e.data);
          showToast(alarm);
          updateAlarmUI();
        });

        eventSource.onerror = (e) => {
          console.error('SSE Error:', e);
          // 에러 발생 시 재연결 시도는 EventSource가 자동으로 수행함
        };

        // 초기 알림 데이터 로드 (읽지 않은 개수 및 목록)
        updateAlarmUI();

        // 종 아이콘 클릭 시 드롭다운 토글
        const alarmBtn = document.getElementById('alarm-btn');
        const alarmDropdown = document.getElementById('alarm-dropdown');
        if (alarmBtn) {
          alarmBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            alarmDropdown.classList.toggle('hidden');
            if (!alarmDropdown.classList.contains('hidden')) {
              fetchAlarmList();
            }
          });
        }

        document.addEventListener('click', () => {
          if (alarmDropdown) alarmDropdown.classList.add('hidden');
        });
      }

      async function updateAlarmUI() {
        try {
          const res = await fetch('/api/alarms/unread-count');
          const count = await res.json();
          const badge = document.getElementById('alarm-count');
          if (count > 0) {
            badge.textContent = count > 99 ? '99+' : count;
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
        } catch (err) { console.error(err); }
      }

      async function fetchAlarmList() {
        try {
          const res = await fetch('/api/alarms');
          const alarms = await res.json();
          renderAlarmList(alarms);
        } catch (err) { console.error(err); }
      }

      function renderAlarmList(alarms) {
        const listContainer = document.getElementById('alarm-list');
        if (alarms.length === 0) {
          listContainer.innerHTML = '<div class="p-12 text-center text-xs text-gray-400 font-medium">새로운 알람이 없습니다.</div>';
          return;
        }

        listContainer.innerHTML = alarms.map(a => `
          <div class="group p-4 transition-colors hover:bg-gray-50 dark:hover:bg-white/5 cursor-pointer ${a.read ? 'opacity-50' : 'bg-primary-light/10'}" 
               onclick="handleAlarmClick(event, ${a.id}, '${a.targetUrl}')">
            <div class="flex gap-3">
              <div class="mt-1 flex-shrink-0 size-2 rounded-full ${a.read ? 'bg-gray-300' : 'bg-primary'}"></div>
              <div class="flex-1">
                <div class="text-[13px] text-text-light-primary dark:text-text-dark-primary leading-snug font-medium group-hover:text-primary transition-colors">${a.content}</div>
                <div class="text-[10px] text-gray-400 mt-1.5 flex items-center gap-1">
                  <span class="material-symbols-outlined !text-[12px]">schedule</span>
                  ${timeAgo(new Date(a.createdAt))}
                </div>
              </div>
            </div>
          </div>
        `).join('');
      }

      function timeAgo(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return '방금 전';
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}분 전`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}시간 전`;
        return `${Math.floor(hours / 24)}일 전`;
      }

      async function handleAlarmClick(e, id, url) {
        if (e) e.stopPropagation();
        try {
          await fetch(`/api/alarms/${id}/read`, { method: 'POST' });
          if (url) location.href = url;
          else location.reload();
        } catch (err) { console.error(err); }
      }

      async function readAllAlarms() {
        await fetch('/api/alarms/read-all', { method: 'POST' });
        updateAlarmUI();
        fetchAlarmList();
      }

      function showToast(alarm) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        
        // 프리미엄 디자인 클래스 구성
        toast.className = "glass relative border border-white/20 dark:border-white/10 text-text-light-primary dark:text-text-dark-primary p-4 rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.12)] flex flex-col gap-2 animate-slide-in max-w-xs pointer-events-auto cursor-pointer overflow-hidden";
        
        toast.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary/20 text-primary">
              <span class="material-symbols-outlined !text-[20px]">notifications_active</span>
            </div>
            <div class="flex flex-col gap-0.5 min-w-0">
              <span class="text-[14px] font-bold leading-tight truncate">${alarm.content}</span>
              <span class="text-[11px] opacity-60">방금 전</span>
            </div>
          </div>
          <!-- 가로 프로그레스 바 -->
          <div class="absolute bottom-0 left-0 h-[3px] w-full bg-primary/30 origin-left" style="animation: toast-progress 4s linear forwards;"></div>
        `;
        
        toast.onclick = () => handleAlarmClick(null, alarm.id, alarm.targetUrl);
        container.appendChild(toast);

        // 4초 후 퇴장 애니메이션 및 삭제
        setTimeout(() => {
          toast.classList.replace('animate-slide-in', 'animate-slide-out');
          setTimeout(() => toast.remove(), 500);
        }, 4000);
      }
    </script>

  </div>

</body>

</html>
